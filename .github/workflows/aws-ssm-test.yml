name: AWS SSM Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  test-ssm:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::282477853061:role/github-actions-ecr-role
          aws-region: ap-south-1

      - name: Send SSM command
        id: send-command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region ap-south-1 \
            --instance-ids i-0bf1e5559e77fc67 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["hostname"]' \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for command result
        run: |
          aws ssm wait command-executed \
            --region ap-south-1 \
            --command-id "$COMMAND_ID" \
            --instance-id i-0bf1e5559e77fc67

      - name: Get command output
        run: |
          aws ssm get-command-invocation \
            --region ap-south-1 \
            --command-id "$COMMAND_ID" \
            --instance-id i-0bf1e5559e77fc67
