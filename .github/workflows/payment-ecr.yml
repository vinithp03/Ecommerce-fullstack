
name: Payment - Build, Push and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/payment-service/**'
      - '.github/workflows/payment-ecr.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: payment-service
  ECR_REGISTRY: 282477853061.dkr.ecr.ap-south-1.amazonaws.com
  EC2_INSTANCE_ID: i-0bf1e55559e77fc67

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Payment
        working-directory: backend/payment-service
        run: ./mvnw clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::282477853061:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        working-directory: backend/payment-service
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            .

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Deploy Payment to EC2
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

          DEPLOY_SCRIPT=$(cat <<EOF
          #!/bin/bash
          set -e

          IMAGE="$IMAGE"
          ECR_REGISTRY="$ECR_REGISTRY"
          AWS_REGION="$AWS_REGION"

          echo "========================================"
          echo "Payment deployment started"
          echo "New image: \$IMAGE"
          echo "========================================"

          # --------------------------------------------------
          # Login to ECR
          # --------------------------------------------------

          aws ecr get-login-password --region "\$AWS_REGION" | \
            docker login --username AWS --password-stdin "\$ECR_REGISTRY"

          # --------------------------------------------------
          # Remember currently running image
          # --------------------------------------------------

          OLD_IMAGE=\$(docker inspect payment-service --format '{{.Config.Image}}')

          echo "Old image: \$OLD_IMAGE"

          # --------------------------------------------------
          # Pull new image
          # --------------------------------------------------

          docker pull "\$IMAGE"

          # --------------------------------------------------
          # Retrieve production configuration from SSM
          # --------------------------------------------------

          echo "Retrieving Payment configuration from SSM..."

          PARAM_PREFIX="/ecommerce/prod/payment/db"

          PAYMENT_DB_URL=\$(aws ssm get-parameter \
            --name "\$PARAM_PREFIX/url" \
            --region "\$AWS_REGION" \
            --query "Parameter.Value" \
            --output text)

          PAYMENT_DB_USERNAME=\$(aws ssm get-parameter \
            --name "\$PARAM_PREFIX/username" \
            --region "\$AWS_REGION" \
            --query "Parameter.Value" \
            --output text)

          PAYMENT_DB_PASSWORD=\$(aws ssm get-parameter \
            --name "\$PARAM_PREFIX/password" \
            --with-decryption \
            --region "\$AWS_REGION" \
            --query "Parameter.Value" \
            --output text)

          echo "Payment configuration retrieved successfully."

          # --------------------------------------------------
          # 1. Start NEW version as candidate
          # --------------------------------------------------

          echo "Starting candidate Payment container..."

          docker rm -f payment-service-new 2>/dev/null || true

          if ! docker run -d \
            --name payment-service-new \
            --restart no \
            --network ecommerce-fullstack_default \
            -p 2104:2004 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e PAYMENT_DB_URL="\$PAYMENT_DB_URL" \
            -e PAYMENT_DB_USERNAME="\$PAYMENT_DB_USERNAME" \
            -e PAYMENT_DB_PASSWORD="\$PAYMENT_DB_PASSWORD" \
            -e SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092 \
            -e ORDER_SERVICE_URL=http://order-service:2003 \
            "\$IMAGE"; then

            echo "ERROR: Candidate Payment container failed to start."
            exit 1
          fi

          # --------------------------------------------------
          # 2. Health-check candidate
          # --------------------------------------------------

          echo "Checking candidate Payment health..."

          CANDIDATE_HEALTHY=false

          for i in \$(seq 1 30); do
            if curl -fsS http://localhost:2104/actuator/health | \
              grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'; then

              CANDIDATE_HEALTHY=true
              echo "Candidate Payment is healthy."
              break
            fi

            echo "Candidate not ready. Attempt \$i/30..."
            sleep 2
          done

          # --------------------------------------------------
          # 3. Candidate failed → keep OLD version
          # --------------------------------------------------

          if [ "\$CANDIDATE_HEALTHY" != "true" ]; then
            echo "ERROR: Candidate Payment failed health check."
            echo "Keeping old Payment version running."

            docker logs payment-service-new || true
            docker rm -f payment-service-new || true

            exit 1
          fi

          # --------------------------------------------------
          # 4. Candidate healthy → prepare cutover
          # --------------------------------------------------

          echo "Candidate passed. Preparing cutover..."

          docker stop payment-service

          docker rename payment-service payment-service-old

          docker rm -f payment-service-new

          # --------------------------------------------------
          # 5. Start NEW version on production port
          # --------------------------------------------------

          echo "Starting new Payment version on port 2004..."

          FINAL_HEALTHY=false

          if docker run -d \
            --name payment-service \
            --restart always \
            --network ecommerce-fullstack_default \
            -p 2004:2004 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e PAYMENT_DB_URL="\$PAYMENT_DB_URL" \
            -e PAYMENT_DB_USERNAME="\$PAYMENT_DB_USERNAME" \
            -e PAYMENT_DB_PASSWORD="\$PAYMENT_DB_PASSWORD" \
            -e SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092 \
            -e ORDER_SERVICE_URL=http://order-service:2003 \
            "\$IMAGE"; then

            echo "New Payment container started."

            # --------------------------------------------------
            # 6. Final health check
            # --------------------------------------------------

            echo "Checking final Payment deployment..."

            for i in \$(seq 1 30); do
              if curl -fsS http://localhost:2004/actuator/health | \
                grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'; then

                FINAL_HEALTHY=true
                echo "New Payment version is healthy."
                break
              fi

              echo "New version not ready. Attempt \$i/30..."
              sleep 2
            done

          else
            echo "ERROR: New Payment container failed to start."
          fi

          # --------------------------------------------------
          # 7. Final deployment failed → ROLLBACK
          # --------------------------------------------------

          if [ "\$FINAL_HEALTHY" != "true" ]; then
            echo "ERROR: New Payment deployment failed."
            echo "Rolling back to old version..."

            docker logs payment-service 2>/dev/null || true
            docker rm -f payment-service 2>/dev/null || true

            docker rename payment-service-old payment-service

            docker start payment-service

            echo "Rollback completed successfully."

            exit 1
          fi

          # --------------------------------------------------
          # 8. Deployment successful → remove OLD version
          # --------------------------------------------------

          echo "Deployment successful."

          docker rm payment-service-old

          if [ "\$OLD_IMAGE" != "\$IMAGE" ]; then
            docker image rm "\$OLD_IMAGE" || true
          fi

          echo "Old image removed: \$OLD_IMAGE"
          echo "New image running: \$IMAGE"

          echo "========================================"
          echo "Payment deployment completed successfully"
          echo "========================================"

          EOF
          )

          ENCODED_SCRIPT=$(printf '%s' "$DEPLOY_SCRIPT" | base64 -w 0)

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"echo $ENCODED_SCRIPT | base64 -d > /tmp/deploy-payment.sh && chmod +x /tmp/deploy-payment.sh && /tmp/deploy-payment.sh\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for deployment
        run: |
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

      - name: Get deployment result
        run: |
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
