name: Cart - Build, Push and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/cart/**'
      - '.github/workflows/cart-ecr.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: cart-service
  ECR_REGISTRY: 282477853061.dkr.ecr.ap-south-1.amazonaws.com
  EC2_INSTANCE_ID: i-0bf1e55559e77fc67

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Cart
        working-directory: backend/cart
        run: ./mvnw clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::282477853061:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        working-directory: backend/cart
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            .

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Deploy Cart to EC2
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

          DEPLOY_SCRIPT=$(cat <<EOF
          set -e

          IMAGE="$IMAGE"
          ECR_REGISTRY="$ECR_REGISTRY"
          AWS_REGION="$AWS_REGION"

          echo "Logging in to ECR..."
          aws ecr get-login-password --region "\$AWS_REGION" | \
            docker login --username AWS --password-stdin "\$ECR_REGISTRY"

          echo "Getting current Cart image..."
          OLD_IMAGE=\$(docker inspect cart-service --format '{{.Config.Image}}')

          echo "Current image: \$OLD_IMAGE"
          echo "New image: \$IMAGE"

          echo "Pulling new Cart image..."
          docker pull "\$IMAGE"

          echo "Cleaning any leftover candidate..."
          docker rm -f cart-service-new 2>/dev/null || true

          echo "Starting candidate Cart container..."

          if ! docker run -d \
            --name cart-service-new \
            --restart no \
            --network ecommerce-fullstack_default \
            -p 2102:2002 \
            -e SPRING_PROFILES_ACTIVE=docker \
            -e SPRING_DATASOURCE_URL='jdbc:mysql://cart-mysql:3306/cartdb?useSSL=false&allowPublicKeyRetrieval=true' \
            -e SPRING_DATASOURCE_USERNAME=cart \
            -e SPRING_DATASOURCE_PASSWORD=cart \
            -e SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092 \
            "\$IMAGE"; then

            echo "ERROR: Candidate Cart container failed to start."
            exit 1
          fi

          echo "Waiting for candidate Cart health..."

          CANDIDATE_HEALTHY=false

          for i in \$(seq 1 30); do
            if curl -fsS http://localhost:2102/actuator/health | \
              grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'; then

              CANDIDATE_HEALTHY=true
              break
            fi

            sleep 2
          done

          if [ "\$CANDIDATE_HEALTHY" != "true" ]; then
            echo "ERROR: Candidate Cart failed health check."

            docker logs cart-service-new || true
            docker rm -f cart-service-new || true

            exit 1
          fi

          echo "Candidate Cart is healthy."

          echo "Stopping old Cart..."
          docker stop cart-service

          echo "Renaming old Cart for rollback..."
          docker rename cart-service cart-service-old

          echo "Removing candidate container..."
          docker rm -f cart-service-new

          echo "Starting final Cart container..."

          FINAL_HEALTHY=false

          if docker run -d \
            --name cart-service \
            --restart always \
            --network ecommerce-fullstack_default \
            -p 2002:2002 \
            -e SPRING_PROFILES_ACTIVE=docker \
            -e SPRING_DATASOURCE_URL='jdbc:mysql://cart-mysql:3306/cartdb?useSSL=false&allowPublicKeyRetrieval=true' \
            -e SPRING_DATASOURCE_USERNAME=cart \
            -e SPRING_DATASOURCE_PASSWORD=cart \
            -e SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092 \
            "\$IMAGE"; then

            echo "Waiting for final Cart health..."

            for i in \$(seq 1 30); do
              if curl -fsS http://localhost:2002/actuator/health | \
                grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'; then

                FINAL_HEALTHY=true
                break
              fi

              sleep 2
            done
          fi

          if [ "\$FINAL_HEALTHY" != "true" ]; then
            echo "ERROR: Final Cart failed health check."
            echo "Rolling back to previous Cart..."

            docker logs cart-service 2>/dev/null || true
            docker rm -f cart-service 2>/dev/null || true

            docker rename cart-service-old cart-service
            docker start cart-service

            exit 1
          fi

          echo "Final Cart is healthy."

          echo "Removing old Cart container..."
          docker rm cart-service-old

          if [ "\$OLD_IMAGE" != "\$IMAGE" ]; then
            echo "Removing old Cart image..."
            docker image rm "\$OLD_IMAGE" || true
          fi

          echo "Cart deployment successful."

          EOF
          )

          ENCODED_SCRIPT=$(echo "$DEPLOY_SCRIPT" | base64 -w 0)

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"echo $ENCODED_SCRIPT | base64 -d > /tmp/deploy-cart.sh && chmod +x /tmp/deploy-cart.sh && /tmp/deploy-cart.sh\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for deployment
        run: |
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

      - name: Get deployment result
        run: |
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"