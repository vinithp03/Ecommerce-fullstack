# --------------------
# App
# --------------------
spring.application.name=payment-service
server.port=2004

# --------------------
# Database
# --------------------
spring.datasource.url=jdbc:mysql://mysql:3306/paymentdb?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------
# JPA
# --------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --------------------
# Kafka
# --------------------
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# --------------------
# Kafka Topic
# --------------------
payment.kafka.topic=payment-events

# --------------------
# Order Service
# --------------------
order.service.url=http://order-service:2003

# Prometheus
management.endpoints.web.exposure.include=health,prometheus,circuitbreaker
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=${spring.application.name}

# Circuit Breaker and retry (Resilience- 4J)
# ===== CIRCUIT BREAKER - orderService =====
resilience4j.circuitbreaker.instances.orderService.register-health-indicator=true
resilience4j.circuitbreaker.instances.orderService.sliding-window-size=5
resilience4j.circuitbreaker.instances.orderService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.orderService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.orderService.permitted-number-of-calls-in-half-open-state=2

# ===== RETRY - orderService =====
resilience4j.retry.instances.orderService.max-attempts=3
resilience4j.retry.instances.orderService.wait-duration=1s
resilience4j.retry.instances.orderService.enable-exponential-backoff=true
resilience4j.retry.instances.orderService.exponential-backoff-multiplier=2

# ===== CIRCUIT BREAKER - paymentGateway =====
resilience4j.circuitbreaker.instances.paymentGateway.register-health-indicator=true
resilience4j.circuitbreaker.instances.paymentGateway.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentGateway.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.paymentGateway.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentGateway.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.paymentGateway.permitted-number-of-calls-in-half-open-state=2

# ===== RETRY - paymentGateway =====
# max-attempts=2 not 3 — don't want to charge customer twice
resilience4j.retry.instances.paymentGateway.max-attempts=2
resilience4j.retry.instances.paymentGateway.wait-duration=2s
resilience4j.retry.instances.paymentGateway.enable-exponential-backoff=true
resilience4j.retry.instances.paymentGateway.exponential-backoff-multiplier=2

# ===== HEALTH =====
management.health.circuitbreakers.enabled=true