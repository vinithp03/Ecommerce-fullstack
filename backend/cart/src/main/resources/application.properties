# App
spring.application.name=cart-service
server.port=2002
spring.jackson.property-naming-strategy=SNAKE_CASE

# Catalog REST
catalog.base-url=${CATALOG_BASE_URL:http://catalog-service:2001}

# Database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initializationFailTimeout=60000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Kafka Consumer
spring.kafka.consumer.group-id=cart-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Topics
catalog.kafka.topic=catalog.events
order.kafka.topic=order-events

# Logging
logging.level.org.springframework.kafka.listener=INFO
logging.level.org.apache.kafka.clients.consumer=INFO

# Prometheus
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=${spring.application.name}

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1