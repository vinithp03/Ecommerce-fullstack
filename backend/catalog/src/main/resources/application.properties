# --------------------
# App
# --------------------
spring.application.name=catalog-service
server.port=2001

# --------------------
# Database
# --------------------
spring.datasource.url=jdbc:mysql://mysql:3306/catalogdb?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=catalog
spring.datasource.password=catalog
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.initializationFailTimeout=60000

# --------------------
# JPA
# --------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --------------------
# Redis
# --------------------
spring.data.redis.host=redis
spring.data.redis.port=6379

spring.cache.type=redis
spring.cache.redis.time-to-live=60s
spring.cache.redis.cache-null-values=false

# Keep cache logging so we can verify HIT/MISS
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis.cache=DEBUG
logging.level.org.springframework.data.redis.connection=DEBUG

spring.main.lazy-initialization=false

# --------------------
# Kafka
# --------------------
spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.template.default-topic=catalog.events

spring.kafka.consumer.group-id=catalog-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.vinith.catalog.events

# --------------------
# Errors
# --------------------
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# --------------------
# Gemini AI
# --------------------
gemini.api.key=AIzaSyB2vbcTemAI885g6hQdrlLKtPkv4MD5xgQ
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# --------------------
# Actuator + Prometheus
# --------------------
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# --------------------
# Hibernate batching
# --------------------
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --------------------
# Multipart
# --------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# --------------------
# Hikari
# --------------------
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10

# --------------------
# Benchmarking
# --------------------
# IMPORTANT: keep SQL logging OFF during wrk
logging.level.org.hibernate.SQL=OFF
logging.level.com.zaxxer.hikari=INFO